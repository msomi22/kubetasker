name: KubeTasker CI/CD

on:
  push:
    branches: ['**']
  pull_request:

env:
  IMAGE_NAME: kubetasker-api

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Validate API imports
        working-directory: api
        run: python -m compileall app

      - name: Smoke test FastAPI app
        working-directory: api
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          for path in ['/health', '/livez', '/readyz', '/startupz', '/version', '/config', '/metrics']:
              response = client.get(path)
              assert response.status_code == 200, f'{path} failed with {response.status_code}: {response.text}'
          PY

      - name: Docker build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker build \
              -t $IMAGE_NAME \
              -t ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest ./api
          else
            docker build -t $IMAGE_NAME ./api
          fi

      - name: Docker Hub login
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker push latest
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest
